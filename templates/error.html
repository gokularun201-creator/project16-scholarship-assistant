{% extends "base.html" %}

{% block title %}Error {{ code }} - Scholarship Application Assistant{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="error-container">
        <div class="error-card">
            <span class="error-icon" aria-hidden="true">⚠️</span>
            <h1 class="error-code">Error {{ code }}</h1>
            <p class="error-message">{{ message }}</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Eligibility Checker</a>
                <a href="{{ url_for('chat') }}" class="btn btn-secondary">Go to Knowledge Assistant</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
